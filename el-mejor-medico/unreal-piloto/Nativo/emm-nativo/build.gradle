apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'es.elmejormedico.nativo'
    compileSdk = 36
    defaultConfig { minSdk = 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // IA generativa dentro del móvil (Google AI Edge, Apache 2.0); Unreal la añade también en su Gradle
    compileOnly 'com.google.ai.edge.litertlm:litertlm-android:0.18.1'
    // voces neuronales Piper (ONNX Runtime de Microsoft, licencia MIT); Unreal la añade también en su Gradle
    compileOnly 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // pruebas del dictado en el ordenador (gradlew :emm-nativo:testReleaseUnitTest)
    testImplementation 'junit:junit:4.13.2'
}
